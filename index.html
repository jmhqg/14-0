<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>14-0</title>
<style>
  :root {
    --bg: #f0f0f5; --surface: #ffffff; --text: #1a1a2e; --muted: #7a7a8e;
    --accent: #2563eb; --green: #10b981; --red: #e74c3c; --gold: #f59e0b;
    --orange: #f97316; --blue: #3b82f6; --purple: #8b5cf6; --border: #e2e2ea;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-tap-highlight-color: transparent; }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 100px; }

  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 2rem; font-weight: 900; color: var(--accent); letter-spacing: -0.5px; }
  header p { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  .score-bar { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 14px; padding: 10px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 12px; }
  .score-section { text-align: center; min-width: 60px; }
  .score-label { font-size: 0.6rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .score-value { font-size: 1.5rem; font-weight: 900; }
  .score-value.good { color: var(--green); }
  .score-value.ok { color: var(--gold); }
  .score-value.bad { color: var(--red); }
  .progress-dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
  .dot.done { background: var(--accent); }
  .dot.active { background: var(--gold); }

  .feedback-bar { text-align: center; background: var(--surface); border-radius: 10px; padding: 10px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); font-size: 0.8rem; color: var(--muted); }
  .feedback-bar .fb-rank { font-weight: 800; }

  .country-card { background: var(--surface); border-radius: 18px; padding: 28px 20px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 12px; border: 2.5px solid var(--accent); transition: all 0.2s; }
  .country-card.spinning { border-color: var(--gold); }
  .country-card .flag { font-size: 52px; margin-bottom: 6px; transition: filter 0.1s; }
  .country-card .flag img.emoji { width: 52px; height: 52px; vertical-align: middle; }
  img.emoji { width: 1em; height: 1em; vertical-align: -0.1em; }
  .country-card.spinning .flag { filter: blur(3px); }
  .country-card .country-name { font-size: 1.3rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
  .country-card.spinning .country-name { filter: blur(1.5px); opacity: 0.7; }
  .country-card .year-label { font-size: 1rem; font-weight: 800; color: var(--accent); margin-top: 2px; }
  .country-card.spinning .year-label { filter: blur(2px); opacity: 0.7; }
  .country-card .squad-count { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }

  .pos-group { margin-bottom: 10px; }
  .pos-header { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; padding-left: 6px; }
  .pick-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface); border-radius: 10px; margin-bottom: 4px; cursor: pointer; border: 1.5px solid var(--border); transition: all 0.12s; }
  .pick-row:active { transform: scale(0.98); }
  .pick-row.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .pick-row .pr-rating { font-weight: 800; font-size: 0.65rem; min-width: 28px; text-align: center; text-transform: uppercase; letter-spacing: 0.3px; }
  .pick-row .pr-name { font-weight: 700; font-size: 0.82rem; flex: 1; }
  .pick-row .pr-pos { font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; color: #fff; }

  .slot-choice { background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 16px; margin-bottom: 12px; text-align: center; }
  .slot-choice-title { font-weight: 800; font-size: 0.85rem; color: var(--accent); margin-bottom: 10px; }
  .slot-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .slot-btn { padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--surface); font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.12s; }
  .slot-btn:active { transform: scale(0.96); }

  .respin-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 12px; border-radius: 14px; border: 2px dashed var(--accent); background: transparent; color: var(--accent); font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 6px; transition: all 0.15s; }
  .respin-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .respin-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .respin-row .respin-btn { flex: 1; margin-bottom: 0; }

  .btn-primary { display: block; width: 100%; max-width: 320px; margin: 20px auto 0; padding: 14px; border-radius: 16px; border: none; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 800; cursor: pointer; transition: transform 0.1s; }
  .btn-primary:active { transform: scale(0.97); }
  .btn-start { display: block; width: 100%; max-width: 320px; margin: 24px auto 0; padding: 16px; border-radius: 16px; border: none; background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 800; cursor: pointer; letter-spacing: 0.3px; }

  .btn-restart { display: block; width: 100%; max-width: 320px; margin: 8px auto 0; padding: 12px; border-radius: 14px; border: 2px solid var(--border); background: transparent; color: var(--muted); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }

  .btn-spin { display: block; width: 100%; max-width: 320px; margin: 12px auto; padding: 14px; border-radius: 16px; border: none; background: var(--accent); color: #fff; font-size: 1rem; font-weight: 800; cursor: pointer; }

  .squad-slots { margin-top: 16px; }
  .squad-slots .slots-title { font-size: 0.7rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-left: 4px; }
  .slot-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface); border-radius: 10px; margin-bottom: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
  .slot-row.empty { opacity: 0.45; }
  .slot-row .sr-emoji { font-size: 1.1rem; width: 24px; text-align: center; }
  .slot-row .sr-label { font-size: 0.65rem; font-weight: 700; color: var(--muted); text-transform: uppercase; min-width: 28px; }
  .slot-row .sr-info { flex: 1; }
  .slot-row .sr-name { font-weight: 700; font-size: 0.82rem; }
  .slot-row .sr-meta { font-size: 0.65rem; color: var(--muted); }
  .slot-row .sr-rating { font-weight: 800; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.3px; }

  .final-screen { background: var(--surface); border-radius: 18px; padding: 28px 20px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-top: 12px; }
  .final-screen h2 { font-size: 1.4rem; }
  .final-screen .final-emoji { font-size: 3.5rem; margin-bottom: 8px; }
  .final-screen .final-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.6; margin-bottom: 16px; max-width: 320px; margin-left: auto; margin-right: auto; }

  .promo-box { display: block; width: 100%; max-width: 320px; margin: 16px auto 0; padding: 14px; border-radius: 14px; background: var(--surface); box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; text-decoration: none; transition: all 0.15s; }
  .promo-box:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .promo-box .promo-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
  .promo-box .promo-title span { color: #15803d; }

  .how-to-play { background: var(--surface); border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
  .how-to-play h3 { color: var(--accent); margin-bottom: 10px; font-size: 0.95rem; }
  .how-to-play ol { padding-left: 18px; color: var(--muted); font-size: 0.85rem; line-height: 1.7; }
  .how-to-play strong { color: var(--text); }

  .footer { text-align: center; padding: 20px 0; color: var(--muted); font-size: 0.75rem; }
  .footer a { color: var(--accent); text-decoration: none; }

  .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>

"Rajasthan Royals":"#ea1a85",
"Gujarat Titans":"#1c1c2b",
"Lucknow Super Giants":"#a72056"
};

const TEAM_SHORT = {
"Chennai Super Kings":"CSK",
"Mumbai Indians":"MI",
"Royal Challengers Bengaluru":"RCB",
"Kolkata Knight Riders":"KKR",
"Delhi Capitals":"DC",
"Sunrisers Hyderabad":"SRH",
"Punjab Kings":"PBKS",
"Rajasthan Royals":"RR",
"Gujarat Titans":"GT",
"Lucknow Super Giants":"LSG"
};

const POS_COLOR = {"BAT":"#f59e0b","BWL":"#3b82f6","AR":"#10b981","KPR":"#8b5cf6"};
const POS_NAME = {"BAT":"Batsmen","BWL":"Bowlers","AR":"All-rounders","KPR":"Keepers"};

const SLOTS = [
  { id:"BAT", label:"Batsman", short:"BAT", emoji:"\u{1F3CF}", accepts:["BAT"] },
  { id:"BWL", label:"Bowler", short:"BWL", emoji:"\u{1F3AF}", accepts:["BWL"] },
  { id:"AR", label:"All-rounder", short:"AR", emoji:"\u{2B50}", accepts:["AR"] },
  { id:"KPR", label:"Keeper", short:"KPR", emoji:"\u{1F9E4}", accepts:["KPR"] },
  { id:"WC", label:"Wildcard", short:"WC", emoji:"\u{1F0CF}", accepts:["BAT","BWL","AR","KPR"] },
];

function ratingColor(r) { return r>=85?"#f59e0b":r>=77?"#10b981":r>=72?"#3b82f6":"#6b7280"; }
function ratingTier(r) { return r>=85?"World Class":r>=77?"Great":r>=72?"Good":"Squad"; }
function rand(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function getYears(t) { return TEAM_YEARS[t] || []; }
function getSquad(t,y) { return (DB_RAW[t]?.[y]||[]).map(([name,rating,pos])=>({name,rating,positions:pos.split(",")})); }

function eligibleSlots(player, squad) {
  return SLOTS.map((s,i)=>({s,i})).filter(({s,i})=> squad[i]===null && s.accepts.some(a=>player.positions.includes(a)));
}

function gaussRnd(m,s) { let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

function simulate(squad) {
  const filled = squad.filter(Boolean);
  const ratings = filled.map(p => p.slotId==="WC" ? p.rating*1.05 : p.rating);
  const avg = ratings.reduce((a,b)=>a+b,0)/ratings.length;
  const min = Math.min(...ratings);
  const penalty = min<72 ? (72-min)*0.3 : 0;
  const score = avg - penalty + gaussRnd(0,5);
  if(score>=94) return {label:"14-0", emoji:"\u{1F3C6}", tier:1, col:"var(--gold)", desc:"Unbeaten. Unstoppable. IPL Champions."};
  if(score>=89) return {label:"13-1", emoji:"\u{1F948}", tier:2, col:"#94a3b8", desc:"One loss all season. So close to perfection."};
  if(score>=85) return {label:"12-2", emoji:"\u{1F949}", tier:3, col:"#cd7f32", desc:"Dominant season. Lost the final but what a campaign."};
  if(score>=83.5) return {label:"11-3", emoji:"\u{1F3CF}", tier:4, col:"var(--green)", desc:"Made the playoffs and gave it a real crack."};
  if(score>=82) return {label:"10-4", emoji:"\u{1F3CF}", tier:5, col:"var(--green)", desc:"Solid squad that peaked at the right time. Top 4 finish."};
  if(score>=81) return {label:"9-5", emoji:"\u{1F3BD}", tier:6, col:"var(--blue)", desc:"Just scraped into the playoffs. Lucky to be there."};
  if(score>=80) return {label:"8-6", emoji:"\u{1F3BD}", tier:7, col:"var(--blue)", desc:"Missed the playoffs by a whisker. Net run rate hurt."};
  if(score>=79) return {label:"7-7", emoji:"\u{274C}", tier:8, col:"var(--orange)", desc:"Middling season. Not bad enough to sack anyone, not good enough to celebrate."};
  if(score>=77.5) return {label:"6-8", emoji:"\u{274C}", tier:9, col:"var(--orange)", desc:"More losses than wins. Fans are getting restless."};
  if(score>=76) return {label:"5-9", emoji:"\u{274C}", tier:10, col:"var(--orange)", desc:"Too many gaps in the squad. A forgettable season."};
  if(score>=74) return {label:"4-10", emoji:"\u{1F480}", tier:11, col:"var(--red)", desc:"Wooden spoon territory. Time to hit the auction hard."};
  if(score>=71.5) return {label:"3-11", emoji:"\u{1F480}", tier:12, col:"var(--red)", desc:"Rock bottom. The franchise needs a complete rebuild."};
  return {label:"2-12", emoji:"\u{1F480}", tier:13, col:"var(--red)", desc:"Historic disaster. Somehow won two games though."};
}

const promoHtml = '<a href="https://worldcup-0.com" target="_blank" class="promo-box"><div class="promo-title">Try <span>WorldCup-0</span></div></a>';

let currentGame = null;

function showStartScreen() {
  document.getElementById('app').innerHTML = `
    <header><h1>14-0</h1><p>Build your ultimate IPL XI</p></header>
    <div class="how-to-play">
      <h3>How to Play</h3>
      <ol>
        <li><strong>5 spins</strong> give you a random IPL team + season</li>
        <li>Pick any <strong>player from that squad</strong> to fill a position</li>
        <li>Positions: <strong>BAT \u{00B7} BWL \u{00B7} AR \u{00B7} KPR \u{00B7} Wildcard</strong></li>
        <li>Higher ratings = <strong>better squad result</strong></li>
        <li><strong>1 free respin</strong> each for team + year per game</li>
        <li>Your squad is simulated \u{2014} <strong>can you win the IPL?</strong></li>
      </ol>
    </div>
    <button class="btn-start" onclick="startGame()">Start Game</button>
    <div style="text-align:center;margin-top:12px;font-size:0.7rem;color:var(--muted)">${TEAMS.length} franchises \u{00B7} 2008\u{2013}2026</div>
    <div style="text-align:center;margin-top:24px;font-size:0.65rem"><a href="privacy.html" style="color:var(--muted);text-decoration:none">Privacy Policy</a></div>
  `;
  twemoji.parse(document.getElementById('app'));
}

function startGame() {
  currentGame = {
    squad: Array(5).fill(null),
    team: null, year: null,
    displayTeam: '', displayYear: '',
    spinning: false, feedback: null,
    picked: null, respinTeamUsed: false, respinYearUsed: false, finished: false,
  };
  doSpin();
}

function doSpin(lockT, lockY) {
  const g = currentGame;
  g.spinning = true;
  g.picked = null;

  let finalT, finalY;
  if (lockT && lockY) { finalT = lockT; finalY = lockY; }
  else if (lockT) { finalT = lockT; finalY = rand(getYears(lockT)); }
  else if (lockY) { const opts = ALL_PAIRS.filter(p => p[1] === lockY); const pick = rand(opts); finalT = pick[0]; finalY = pick[1]; }
  else { const pick = rand(ALL_PAIRS); finalT = pick[0]; finalY = pick[1]; }

  let ticks = 0;
  const maxTicks = 14;

  function tick() {
    ticks++;
    g.displayTeam = lockT || rand(TEAMS);
    g.displayYear = lockY || rand(ALL_YEARS);
    renderGame();
    if (ticks < maxTicks) {
      setTimeout(tick, 50 + ticks * 18);
    } else {
      g.displayTeam = finalT;
      g.displayYear = finalY;
      g.team = finalT;
      g.year = finalY;
      g.spinning = false;
      renderGame();
    }
  }
  tick();
}

function selectPlayer(idx) {
  const g = currentGame;
  if (g.spinning || g.finished) return;
  const squad = getSquad(g.team, g.year);
  const player = squad[idx];
  const elig = eligibleSlots(player, g.squad);
  if (elig.length === 0) return;
  if (elig.length === 1) { assignToSlot(player, elig[0].i); }
  else { g.picked = { player, eligible: elig }; renderGame(); }
}

function assignToSlot(player, slotIdx) {
  const g = currentGame;
  g.squad[slotIdx] = { ...player, slotId: SLOTS[slotIdx].id, team: g.team, year: g.year };
  g.picked = null;
  g.feedback = { name: player.name, slot: SLOTS[slotIdx].label, rating: player.rating };

  const pickCount = g.squad.filter(Boolean).length;
  if (pickCount >= 5) {
    g.finished = true;
    renderGame();
  } else {
    renderGame();
    setTimeout(() => doSpin(), 1500);
  }
}

function cancelPick() { currentGame.picked = null; renderGame(); }

function assignPickedToSlot(slotIdx) {
  if (currentGame.picked) assignToSlot(currentGame.picked.player, slotIdx);
}

function respinTeam() {
  const g = currentGame;
  g.respinTeamUsed = true;
  doSpin(null, g.year);
}
function respinYear() {
  const g = currentGame;
  g.respinYearUsed = true;
  doSpin(g.team, null);
}

function restartGame() { startGame(); }

function renderGame() {
  const g = currentGame;
  const pickCount = g.squad.filter(Boolean).length;
  let html = '';

  html += '<header><h1>14-0</h1><p>Build your ultimate IPL XI</p></header>';

  html += '<div class="score-bar"><div class="score-section"><div class="score-label">Pick</div><div class="score-value ' + (pickCount>=5?'good':'') + '">' + Math.min(pickCount+1,5) + '/5</div></div><div class="progress-dots">';
  SLOTS.forEach((_, i) => {
    html += '<div class="dot ' + (g.squad[i]?'done':'') + ' ' + (i===pickCount&&!g.finished?'active':'') + '"></div>';
  });
  html += '</div><div class="score-section"><div class="score-label">Slots</div><div class="score-value">' + (5-pickCount) + '</div></div></div>';

  if (g.feedback && !g.finished) {
    html += '<div class="feedback-bar">' + g.feedback.name + ' \u{2192} ' + g.feedback.slot + ': <span class="fb-rank" style="color:' + ratingColor(g.feedback.rating) + '">' + ratingTier(g.feedback.rating) + '</span></div>';
  }

  if (!g.finished) {
    const teamColor = TEAM_COLORS[g.displayTeam] || 'var(--accent)';
    const teamShort = TEAM_SHORT[g.displayTeam] || '';
    const squadSize = (!g.spinning && g.team) ? getSquad(g.team, g.year).length : 0;
    html += '<div class="country-card ' + (g.spinning?'spinning':'') + '" style="border-color:' + (g.spinning?'var(--gold)':teamColor) + '"><div class="flag" style="font-size:2rem;font-weight:900;color:' + teamColor + '">' + teamShort + '</div><div class="country-name">' + (g.displayTeam||'…') + '</div><div class="year-label" style="color:' + teamColor + '">' + (g.displayYear||'…') + '</div>';
    if (!g.spinning && squadSize) html += '<div class="squad-count">' + squadSize + ' players available</div>';
    html += '</div>';
  }

  if (g.picked) {
    html += '<div class="slot-choice"><div class="slot-choice-title">' + g.picked.player.name + ' can play multiple positions:</div><div class="slot-btns">';
    g.picked.eligible.forEach(({s,i}) => {
      html += '<button class="slot-btn" onclick="assignPickedToSlot(' + i + ')" style="border-color:' + (POS_COLOR[s.id]||'var(--border)') + '">' + s.emoji + ' ' + s.label + '</button>';
    });
    html += '<button class="slot-btn" onclick="cancelPick()">Cancel</button></div></div>';
  }

  if (!g.spinning && !g.finished && g.team && !g.picked) {
    const squad = getSquad(g.team, g.year);
    ["BAT","BWL","AR","KPR"].forEach(pos => {
      const group = squad.map((p,idx)=>({...p,idx})).filter(p => p.positions.includes(pos));
      if (!group.length) return;
      html += '<div class="pos-group"><div class="pos-header" style="color:' + POS_COLOR[pos] + '">' + POS_NAME[pos] + '</div>';
      group.forEach(p => {
        const elig = eligibleSlots(p, g.squad);
        const playable = elig.length > 0;
        html += '<div class="pick-row ' + (playable?'':'disabled') + '" onclick="' + (playable?'selectPlayer('+p.idx+')':'') + '"><div class="pr-rating" style="color:' + ratingColor(p.rating) + '">' + ratingTier(p.rating) + '</div><div class="pr-name">' + p.name + (p.positions.length>1?' <span style="font-size:0.6rem;color:var(--muted);font-weight:600">(' + p.positions.join('/') + ')</span>':'') + '</div><div class="pr-pos" style="background:' + POS_COLOR[pos] + '">' + pos + '</div></div>';
      });
      html += '</div>';
    });
  }

  if (!g.spinning && !g.finished && !g.picked && g.team) {
    html += '<div class="respin-row"><button class="respin-btn" onclick="respinTeam()"' + (g.respinTeamUsed?' disabled':'') + '>\u{1F504} Respin Team</button><button class="respin-btn" onclick="respinYear()"' + (g.respinYearUsed?' disabled':'') + '>\u{1F4C5} Respin Year</button></div>';
    html += '<button class="btn-restart" onclick="restartGame()">Restart</button>';
    html += promoHtml;
  }

  if (pickCount > 0 || g.finished) {
    html += '<div class="squad-slots"><div class="slots-title">Your XI</div>';
    SLOTS.forEach((slot, i) => {
      const p = g.squad[i];
      html += '<div class="slot-row ' + (p?'':'empty') + '"><div class="sr-emoji">' + slot.emoji + '</div><div class="sr-label">' + slot.short + '</div><div class="sr-info">';
      if (p) {
        html += '<div class="sr-name">' + p.name + '</div><div class="sr-meta">' + (TEAM_SHORT[p.team]||'') + ' \u{00B7} ' + p.year + '</div>';
      } else {
        html += '<div class="sr-name" style="color:var(--muted)">Empty</div>';
      }
      html += '</div>';
      if (p) html += '<div class="sr-rating" style="color:' + ratingColor(p.rating) + '">' + ratingTier(p.rating) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  if (g.finished) {
    const result = simulate(g.squad);
    html += '<div class="final-screen"><div class="final-emoji">' + result.emoji + '</div><h2 style="color:' + result.col + '">' + result.label + '</h2><div class="final-desc">' + result.desc + '</div>';
    html += '<button class="btn-primary" onclick="startGame()">Play Again</button>' + promoHtml + '</div>';
  }

  document.getElementById('app').innerHTML = html;
  twemoji.parse(document.getElementById('app'));
}

showStartScreen();
</script>
</body>
</html>
